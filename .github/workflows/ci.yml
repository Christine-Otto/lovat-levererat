name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

  build-and-verify:
    name: Build and verify
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t leveransdatum:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name leveransdatum -p 8000:8000 leveransdatum:${{ github.sha }}

      - name: Verify deployment
        run: bash scripts/verify.sh 1.0.0 || (docker logs leveransdatum; exit 1)

      - name: Stop container
        if: always()
        run: docker rm -f leveransdatum || true